name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install project dependencies
        run: npm install

      - name: Install Native Google Sign-In
        run: npm install @capawesome/capacitor-google-sign-in@0.1.2

      - name: Build Web Application
        run: npm run build

      - name: Generate Official Cafe Eldeeb Icons
        run: node scripts/generate-icons.cjs

      - name: Restore Persistent Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/debug.keystore
              echo "Restored persistent keystore from GitHub Secret."
            else
              echo "" | base64 -d > android/app/debug.keystore
              echo "Restored persistent keystore from fallback base64."
            fi
          fi
          if [ ! -f android/app/debug.keystore ]; then
            echo "Error: android/app/debug.keystore could not be restored!"
            exit 1
          fi
          echo "Static debug keystore verified successfully."

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          echo "Android project verified successfully."

      - name: Ensure Valid Gradle Wrapper
        working-directory: android
        run: |
          if ! unzip -t gradle/wrapper/gradle-wrapper.jar 2>/dev/null | grep -q "GradleWrapperMain.class"; then
            echo "gradle-wrapper.jar is invalid. Fetching official Gradle 8.7 wrapper jar..."
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          echo "Gradle wrapper verified."

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace || (sleep 10 && ./gradlew assembleDebug --stacktrace)

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
