name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Check Capacitor
        run: npx cap --version

      - name: Create Android platform if needed
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate Android App Icon
        run: |
          set -e

          LOGO="src/Images/eldeeb-app-logo.png"

          if [ ! -f "$LOGO" ]; then
            echo "ERROR: Logo file not found: $LOGO"
            exit 1
          fi

          echo "Using logo:"
          file "$LOGO"
          identify "$LOGO"

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          magick "$LOGO" -auto-orient -resize 48x48^ -gravity center -extent 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          magick "$LOGO" -auto-orient -resize 72x72^ -gravity center -extent 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          magick "$LOGO" -auto-orient -resize 96x96^ -gravity center -extent 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          magick "$LOGO" -auto-orient -resize 144x144^ -gravity center -extent 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          magick "$LOGO" -auto-orient -resize 192x192^ -gravity center -extent 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          echo "Android launcher icons generated successfully."

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Verify Gradle Wrapper
        working-directory: android
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          ls -lh gradlew
          ls -lh gradle/wrapper/

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
