name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install project dependencies
        run: npm install

      - name: Install Native Google Sign-In
        run: npm install @capawesome/capacitor-google-sign-in@0.1.2

      - name: Build Web Application
        run: npm run build

      - name: Generate Official Cafe Eldeeb Icons
        run: node scripts/generate-icons.cjs

      - name: Restore Persistent Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app

          # Binary-safe Base64 decode using Python with authentic fallback to ensure zero CI failure
          python3 -c "
          import os, base64, re, sys

          raw_data = os.environ.get('KEYSTORE_BASE64', '')
          cleaned = re.sub(r'[\r\n\t\s\"\']', '', raw_data)

          decoded = None
          if cleaned and len(cleaned) > 200:
              try:
                  decoded = base64.b64decode(cleaned)
              except Exception:
                  try:
                      decoded = base64.urlsafe_b64decode(cleaned)
                  except Exception as e:
                      print(f'Warning: Secret decode failed: {e}', file=sys.stderr)

          # If secret is missing or truncated (e.g. 30 bytes), use the exact authentic persistent debug keystore
          if not decoded or len(decoded) < 500:
              print('Notice: Secret was truncated or not provided, restoring from persistent authentic base64.')
              AUTHENTIC_BASE64 = ''''''
              decoded = base64.b64decode(re.sub(r'\s+', '', AUTHENTIC_BASE64))

          with open('android/app/debug.keystore', 'wb') as f:
              f.write(decoded)

          print(f'Decoded file size: {len(decoded)} bytes')
          "

          if [ ! -f android/app/debug.keystore ] || [ ! -s android/app/debug.keystore ]; then
            echo "Error: android/app/debug.keystore does not exist or is 0 bytes!"
            exit 1
          fi

          echo "Verifying Keystore with keytool..."
          FINGERPRINTS=""

          # Try default storetype, JKS, and PKCS12 storetypes in read-only mode
          if FINGERPRINTS=$(keytool -list -v -keystore android/app/debug.keystore -storepass android 2>&1); then
            echo "Keystore read successfully with default format."
          elif FINGERPRINTS=$(keytool -list -v -keystore android/app/debug.keystore -storetype JKS -storepass android 2>&1); then
            echo "Keystore read successfully with JKS format."
          elif FINGERPRINTS=$(keytool -list -v -keystore android/app/debug.keystore -storetype PKCS12 -storepass android 2>&1); then
            echo "Keystore read successfully with PKCS12 format."
          else
            echo "Error: Failed to read keystore with keytool! Output:"
            echo "$FINGERPRINTS"
            echo "The GitHub Secret ANDROID_DEBUG_KEYSTORE_BASE64 is malformed or does not represent a valid Java keystore."
            exit 1
          fi

          EXPECTED_SHA1="98:37:C5:3A:58:34:A4:33:1C:14:2C:70:EC:32:0C:2A:AB:15:A4:51"
          EXPECTED_SHA256="BB:2B:85:58:0C:41:8B:89:B8:AF:86:47:D1:1B:61:23:31:A9:B5:83:94:85:01:C1:39:32:A8:5A:61:1C:75:D4"

          ACTUAL_SHA1=$(echo "$FINGERPRINTS" | grep -i "SHA1:" | head -n 1 | awk '{print $2}' | tr 'a-z' 'A-Z')
          ACTUAL_SHA256=$(echo "$FINGERPRINTS" | grep -i "SHA256:" | head -n 1 | awk '{print $2}' | tr 'a-z' 'A-Z')

          echo "Expected SHA1:   $EXPECTED_SHA1"
          echo "Actual SHA1:     $ACTUAL_SHA1"
          echo "Expected SHA256: $EXPECTED_SHA256"
          echo "Actual SHA256:   $ACTUAL_SHA256"

          if [ -z "$ACTUAL_SHA1" ] || [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "Error: SHA-1 fingerprint mismatch! Actual: '$ACTUAL_SHA1', Expected: '$EXPECTED_SHA1'"
            exit 1
          fi

          if [ -z "$ACTUAL_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "Error: SHA-256 fingerprint mismatch! Actual: '$ACTUAL_SHA256', Expected: '$EXPECTED_SHA256'"
            exit 1
          fi

          echo "Static debug keystore restored and verified successfully with exact fingerprints."

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          echo "Android project verified successfully."

      - name: Ensure Valid Gradle Wrapper
        working-directory: android
        run: |
          if ! unzip -t gradle/wrapper/gradle-wrapper.jar 2>/dev/null | grep -q "GradleWrapperMain.class"; then
            echo "gradle-wrapper.jar is invalid. Fetching official Gradle 8.7 wrapper jar..."
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          echo "Gradle wrapper verified."

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace || (sleep 10 && ./gradlew assembleDebug --stacktrace)

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
