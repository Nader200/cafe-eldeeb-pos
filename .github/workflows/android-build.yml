name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install project dependencies
        run: npm install

      - name: Install Native Google Sign-In
        run: npm install @capawesome/capacitor-google-sign-in@0.1.2

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare Gradle Wrapper
        working-directory: android
        run: |
          chmod +x gradlew

          mkdir -p gradle/wrapper

          rm -f gradle/wrapper/gradle-wrapper.jar

          curl -fL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

          echo "Checking Gradle Wrapper JAR..."

          unzip -t gradle/wrapper/gradle-wrapper.jar

          if ! unzip -l gradle/wrapper/gradle-wrapper.jar | grep -q "org/gradle/wrapper/GradleWrapperMain.class"; then
            echo "ERROR: GradleWrapperMain.class is missing from gradle-wrapper.jar"
            exit 1
          fi

          echo "Gradle Wrapper JAR is valid."

      - name: Verify Android project
        working-directory: android
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f app/build.gradle
          echo "Android project verified successfully."

      - name: Verify Gradle Wrapper
        working-directory: android
        run: |
          ./gradlew --version

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
